<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم المشرف</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-card {
            background-color: white;
            border-radius: 12px;
            padding: 20px 30px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 700;
            color: #764ba2;
        }

        .stat-card .label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .section {
            background-color: white;
            border-radius: 12px;
            padding: 25px;
            max-width: 900px;
            margin: 0 auto 25px auto;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .section h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: right;
            border-bottom: 1px solid #eee;
        }

        th {
            color: #764ba2;
            font-weight: 700;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .badge.done {
            background-color: #d4f4dd;
            color: #27ae60;
        }

        .badge.pending {
            background-color: #fdf0d5;
            color: #e67e22;
        }

        .delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Tajawal', Arial, sans-serif;
            font-size: 13px;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }

        .back-link {
            display: block;
            text-align: center;
            color: white;
            margin-top: 20px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>لوحة تحكم المشرف 👨‍💼</h1>

    <div class="stats">
        <div class="stat-card">
            <div class="number" id="usersCount">0</div>
            <div class="label">إجمالي المستخدمين</div>
        </div>
        <div class="stat-card">
            <div class="number" id="tasksCount">0</div>
            <div class="label">إجمالي المهام</div>
        </div>
        <div class="stat-card">
            <div class="number" id="doneCount">0</div>
            <div class="label">مهام مكتملة</div>
        </div>
    </div>

    <div class="section">
        <h2>المستخدمون</h2>
        <table id="usersTable">
            <thead>
                <tr>
                    <th>الاسم</th>
                    <th>مشرف؟</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="usersBody"></tbody>
        </table>
    </div>

    <div class="section">
        <h2>كل المهام</h2>
        <table id="tasksTable">
            <thead>
                <tr>
                    <th>المهمة</th>
                    <th>صاحب المهمة</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="tasksBody"></tbody>
        </table>
    </div>

    <a href="/app-page" class="back-link">⬅ الرجوع لصفحة المهام</a>

    <script>
        async function loadAdminData() {
            const response = await fetch('/admin/users', { credentials: 'include' });

            if (response.status === 403 || response.status === 401) {
                document.body.innerHTML = '<h1 style="text-align:center; margin-top:100px;">غير مصرح لك بالدخول لهذي الصفحة</h1>';
                return;
            }

            const data = await response.json();

            document.getElementById('usersCount').textContent = data.users.length;
            document.getElementById('tasksCount').textContent = data.tasks.length;
            document.getElementById('doneCount').textContent = data.tasks.filter(t => t.done).length;

            const usersBody = document.getElementById('usersBody');
            usersBody.innerHTML = '';
            data.users.forEach(function(user) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.username}</td>
                    <td>${user.is_admin ? '✅' : '—'}</td>
                    <td><button class="delete-btn" onclick="deleteUser(${user.id})">حذف</button></td>
                `;
                usersBody.appendChild(tr);
            });

            const tasksBody = document.getElementById('tasksBody');
            tasksBody.innerHTML = '';
            data.tasks.forEach(function(task) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${task.title}</td>
                    <td>${task.username}</td>
                    <td><span class="badge ${task.done ? 'done' : 'pending'}">${task.done ? 'مكتملة' : 'قيد التنفيذ'}</span></td>
                `;
                tasksBody.appendChild(tr);
            });
        }

        async function deleteUser(userId) {
            if (!confirm('متأكد تبي تحذف هذا المستخدم؟')) return;

            await fetch('/admin/users/' + userId, {
                method: 'DELETE',
                credentials: 'include'
            });

            loadAdminData();
        }

        loadAdminData();
    </script>
</body>
</html>
