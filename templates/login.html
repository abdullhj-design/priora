<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>priora</title>
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', Arial, sans-serif;
            background: #eef1f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 8px 28px rgba(15, 23, 42, 0.1);
            width: 100%;
            max-width: 340px;
            overflow: hidden;
        }

        .accent-bar {
            height: 5px;
            background: linear-gradient(90deg, #22d3ee 0%, #6366f1 100%);
        }

        .card-inner {
            padding: 32px 30px;
        }

        h1 {
            color: #0f172a;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #8a93a3;
            font-size: 13px;
            text-align: center;
            margin-bottom: 22px;
        }

        .tabs {
            display: flex;
            margin-bottom: 22px;
            border-bottom: 1.5px solid #eef0f4;
        }

        .tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            cursor: pointer;
            color: #a0a8b4;
            font-weight: 500;
            font-size: 14px;
            border-bottom: 2px solid transparent;
            margin-bottom: -1.5px;
            transition: color 0.2s, border-color 0.2s;
        }

        .tab.active {
            color: #0f172a;
            border-bottom: 2px solid #6366f1;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            font-family: 'Tajawal', Arial, sans-serif;
            border: 1.5px solid #e7e9ef;
            border-radius: 10px;
            outline: none;
            margin-bottom: 12px;
            background-color: #fbfcfe;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #6366f1;
        }

        button.submit-btn {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-family: 'Tajawal', Arial, sans-serif;
            font-weight: 700;
            background: linear-gradient(90deg, #22d3ee 0%, #6366f1 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 6px;
            transition: opacity 0.2s;
        }

        button.submit-btn:hover {
            opacity: 0.9;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .message.error {
            color: #e74c3c;
        }

        .message.success {
            color: #16a34a;
        }

        .hidden {
            display: none;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 12px;
        }

        .logo-img {
            width: 90px;
            height: auto;
        }

        @media (max-width: 360px) {
            body {
                padding: 10px;
            }

            .card-inner {
                padding: 24px 20px;
            }

            h1 {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="accent-bar"></div>
        <div class="card-inner">
            <div class="logo-container">
                <img src="/static/images/logo.png" alt="Priora Logo" class="logo-img">
            </div>
            <h1>مرحبًا بعودتك</h1>
            <div class="subtitle">أنجز مهامك بذكاء مع Priora</div>

            <div class="tabs">
                <div class="tab active" id="loginTab">تسجيل دخول</div>
                <div class="tab" id="registerTab">حساب جديد</div>
            </div>

            <div id="loginForm">
                <input type="text" id="loginUsername" placeholder="الاسم">
                <input type="password" id="loginPassword" placeholder="كلمة المرور">
                <button class="submit-btn" id="loginBtn">دخول</button>
            </div>

            <div id="registerForm" class="hidden">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="registerFirstName" placeholder="الاسم الأول" style="flex: 1;">
                    <input type="text" id="registerLastName" placeholder="اسم العائلة" style="flex: 1;">
                </div>
                <input type="password" id="registerPassword" placeholder="كلمة المرور">
                <button class="submit-btn" id="registerBtn">إنشاء حساب</button>
            </div>

            <div id="messageBox" class="message"></div>
        </div>
    </div>

    <script>
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const messageBox = document.getElementById('messageBox');

        loginTab.addEventListener('click', function() {
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            messageBox.textContent = '';
        });

        registerTab.addEventListener('click', function() {
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            messageBox.textContent = '';
        });

        document.getElementById('loginBtn').addEventListener('click', async function() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ username: username, password: password })
            });

            const data = await response.json();

            if (response.ok) {
                messageBox.textContent = data.message;
                messageBox.className = 'message success';
                setTimeout(function() {
                    window.location.href = '/app-page';
                }, 1000);
            } else {
                messageBox.textContent = data.error;
                messageBox.className = 'message error';
            }
        });

        document.getElementById('registerBtn').addEventListener('click', async function() {
            const firstName = document.getElementById('registerFirstName').value.trim();
            const lastName = document.getElementById('registerLastName').value.trim();
            if (firstName === '' || lastName === '') {
                alert('الرجاء إدخال الاسم الأول واسم العائلة');
                return;
            }
            const username = firstName + ' ' + lastName;

            const password = document.getElementById('registerPassword').value.trim();

            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            });

            const data = await response.json();

            if (response.ok) {
                messageBox.textContent = data.message + ' — سجّل دخولك الآن';
                messageBox.className = 'message success';
                loginTab.click();
            } else {
                messageBox.textContent = data.error;
                messageBox.className = 'message error';
            }
        });
    </script>
</body>
</html>
