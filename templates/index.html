<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>priora</title>
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
        }

        h1 {
            color: white;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .top-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
.logout-btn {
    position: fixed !important;
    top: 20px;
    right: 20px;
    width: auto;
    max-width: 120px;
    background: none;
    border: 1px solid white;
    color: white;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'Tajawal', Arial, sans-serif;
    z-index: 9999;
}
        .card {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
            width: 400px;
        }

        .input-group {
            display: flex;
            margin-bottom: 20px;
            gap: 10px;
        }

        #taskInput {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-family: 'Tajawal', Arial, sans-serif;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        #taskInput:focus {
            border-color: #764ba2;
        }

        button {
            padding: 12px 22px;
            font-size: 15px;
            font-family: 'Tajawal', Arial, sans-serif;
            font-weight: 500;
            background-color: #764ba2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #5e3a85;
        }

        .task-counter {
            text-align: center;
            font-size: 13px;
            color: #764ba2;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .empty-msg {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-top: 15px;
        }

        .hidden {
            display: none;
        }

        #taskList {
            list-style: none;
        }

        #taskList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f7f6fb;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 15px;
            animation: slideIn 0.3s ease;
            gap: 10px;
        }

        #taskList li.completed span {
            text-decoration: line-through;
            color: #aaa;
        }

        .task-text {
            flex: 1;
        }

       .task-buttons {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

        .analyze-btn {
            background-color: #764ba2;
            padding: 6px 12px;
            font-size: 14px;
        }
.pin-btn {
    background-color: #f39c12;
    padding: 6px 10px;
    font-size: 14px;
}

.pin-btn:hover {
    background-color: #d68910;
}
        .analyze-btn:hover {
            background-color: #5e3a85;
        }

        .complete-btn {
            background-color: #27ae60;
            padding: 6px 12px;
            font-size: 13px;
        }

        .complete-btn:hover {
            background-color: #1e8449;
        }

        .delete-btn {
            background-color: #e74c3c;
            padding: 6px 14px;
            font-size: 13px;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }

        #loadingMsg {
            display: none;
            text-align: center;
            color: #764ba2;
            font-size: 14px;
            margin-top: 10px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 10px;
            }

            h1 {
                font-size: 24px;
            }

            .card {
                width: 100%;
                padding: 20px;
            }

            .input-group {
                flex-direction: column;
            }

            #taskInput {
                margin-bottom: 10px;
            }

            button {
                width: 100%;
            }
        }

        .chat-button {
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 55px;
            height: 55px;
            background-color: #764ba2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            animation: pulse-chat 2s infinite;
        }
        @keyframes pulse-chat {
    0% {
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 0 0 rgba(118, 75, 162, 0.6);
    }
    70% {
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 0 15px rgba(118, 75, 162, 0);
    }
    100% {
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 0 0 rgba(118, 75, 162, 0);
    }
}

        .chat-window {
            position: fixed;
            bottom: 90px;
            left: 25px;
            width: 300px;
            height: 400px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            overflow: hidden;
        }
        .chat-window.hidden {
            display: none !important;
        }

        .chat-header {
            background-color: #764ba2;
            color: white;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
        }

        .close-chat {
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-size: 13px;
        }

        .chat-msg {
            margin-bottom: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.4;
            white-space: pre-line;
        }

        .chat-msg.user {
            background-color: #764ba2;
            color: white;
            margin-left: auto;
        }

        .chat-msg.bot {
            background-color: #f0f0f0;
            color: #333;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            gap: 6px;
            border-top: 1px solid #eee;
        }

        .chat-input-area input {
            flex: 1;
            padding: 8px;
            font-size: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .chat-input-area button {
            padding: 8px 12px;
            font-size: 13px;
        }
        .top-logo {
            width: 100px;
            height: auto;
            margin-bottom: 8px;
        }
        .celebration-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
}
.celebration-overlay.hidden {
    display: none !important;
}
.daily-summary-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
}

.daily-summary-overlay.hidden {
    display: none !important;
}

.daily-summary-box {
    background: linear-gradient(135deg, #1a1a2e 0%, #4a3b6e 100%);
    border-radius: 20px;
    padding: 40px 30px;
    text-align: center;
    max-width: 340px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.daily-summary-box h2 {
    color: #fff;
    font-size: 22px;
    margin-bottom: 20px;
}

.daily-summary-box .summary-line {
    color: #e0e0e0;
    font-size: 15px;
    margin-bottom: 12px;
    text-align: right;
}

.daily-summary-box .farewell {
    color: #ffd700;
    font-size: 15px;
    margin-top: 20px;
    margin-bottom: 20px;
}

.daily-summary-box button {
    background-color: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 10px 25px;
}
.celebration-box {
    background-color: white;
    border-radius: 16px;
    padding: 40px 30px;
    text-align: center;
    max-width: 320px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

.celebration-box h2 {
    color: #764ba2;
    font-size: 22px;
    margin-bottom: 10px;
}

.celebration-box p {
    color: #666;
    font-size: 15px;
    margin-bottom: 20px;
}

.celebration-box button {
    background-color: #764ba2;
    padding: 10px 25px;
}
.streak-text {
    color: white;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 15px;
    text-align: center;
}
.daily-goal-box {
    background-color: #fef9e7;
    border: 2px solid #f1c40f;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
    text-align: center;
}

.daily-goal-box .label {
    font-size: 13px;
    color: #b7950b;
    font-weight: 500;
    margin-bottom: 6px;
}

.daily-goal-box .goal-name {
    font-size: 18px;
    font-weight: 700;
    color: #333;
}

.next-task-box {
    background-color: #fff3e0;
    border: 2px solid #ff9800;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
    text-align: center;
}

.next-task-box .label {
    font-size: 13px;
    color: #e65100;
    font-weight: 500;
    margin-bottom: 6px;
}

.next-task-box .task-name {
    font-size: 18px;
    font-weight: 700;
    color: #333;
    margin-bottom: 6px;
}

.next-task-box .reason {
    font-size: 12px;
    color: #888;
}
    </style>
</head>
<body>
    <button class="logout-btn" id="logoutBtn">تسجيل الخروج</button>

<div class="top-bar">
    <img src="/static/images/logo2.png" alt="Priora Logo" class="top-logo">
    <h1 id="greeting"></h1>
    </div>
     <p id="streakDisplay" class="streak-text"></p>
    <div class="card">
<div id="prioritizeResultWrapper" style="display: none; margin-bottom: 30px;">
    <div style="text-align: center; margin-bottom: 10px;">
        <img src="/static/images/logo2.png" alt="Priora Logo" style="width: 50px; height: auto;">
    </div>
    <div id="prioritizeResult" style="background-color: white; border: 2px solid #764ba2; border-radius: 12px; padding: 15px; font-size: 14px; line-height: 1.6; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);"></div>
</div>        <div class="input-group">
            <input type="text" id="taskInput" placeholder="اكتب مهمة جديدة...">
            <button type="button" id="addBtn">➕ إضافة</button>
        </div>

        <p id="taskCounter" class="task-counter"></p> 
        <div id="streakBox" class="streak-box hidden">
    🔥 <span id="streakCount"></span> أيام متتالية
</div> 
        <div id="dailyGoalBox" class="daily-goal-box hidden">
    <div class="label">⭐ هدف اليوم</div>
    <div id="dailyGoalName" class="goal-name"></div>
</div>

<div id="nextTaskBox" class="next-task-box hidden">
    <div class="label">🎯 مهمتك التالية</div>
    <div class="task-name" id="nextTaskName"></div>
    <div class="reason" id="nextTaskReason"></div>
</div>
        <ul id="taskList">
        </ul>
        <p id="emptyMsg" class="empty-msg hidden">لا توجد مهام حاليًا 📭</p>
        <div id="loadingMsg">⏳ جاري التحميل...</div>
<button id="prioritizeBtn" style="width: 100%; margin-bottom: 15px; background-color: #764ba2;">🤖 رتّب يومي</button>

    </div>
<div id="celebrationOverlay" class="celebration-overlay hidden">
    <div class="celebration-box">
<h2>أحسنت! 🎉</h2>       
 <p>أنجزت جميع مهامك اليوم.</p>
        <button id="closeCelebration">حسنًا</button>
    </div>
</div>
<div id="dailySummaryOverlay" class="daily-summary-overlay hidden">
    <div class="daily-summary-box">
        <h2>🌙 ملخص يومك ✨</h2>
        <div class="summary-line" id="summaryDone"></div>
        <div class="summary-line" id="summaryRemaining"></div>
        <div class="summary-line" id="summaryPercent"></div>
        <div class="farewell">أحسنت! نراك غدًا بيوم جديد 👋</div>
        <button id="closeDailySummary">حسنًا</button>
    </div>
</div>

<div id="chatButton" class="chat-button">💬</div>


    <div id="chatWindow" class="chat-window hidden">
        <div class="chat-header">
            <span> Priora AI🤖</span>
            <span id="closeChat" class="close-chat">✕</span>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="اكتب رسالتك...">
            <button id="chatSendBtn">إرسال</button>
        </div>
    </div>

    <script>
        const username = "{{ username }}";
        const greetingEl = document.getElementById('greeting');
        const currentHour = new Date().getHours();

        let greetingText = '';
        if (currentHour >= 0 && currentHour < 12) {
            greetingText = 'صباح الخير';
        } else {
            greetingText = 'مساء الخير';
        }

        greetingEl.textContent = greetingText + '، ' + username;

        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');
        const addButton = document.getElementById('addBtn');
        const logoutButton = document.getElementById('logoutBtn');
        const loadingMsg = document.getElementById('loadingMsg');
        const taskCounter = document.getElementById('taskCounter');
        const emptyMsg = document.getElementById('emptyMsg');
        const celebrationOverlay = document.getElementById('celebrationOverlay');
const closeCelebration = document.getElementById('closeCelebration');
let celebrationShown = false;
const nextTaskBox = document.getElementById('nextTaskBox');
const nextTaskName = document.getElementById('nextTaskName');
const nextTaskReason = document.getElementById('nextTaskReason');
let savedOrder = null;
const dailyGoalBox = document.getElementById('dailyGoalBox');
const dailyGoalName = document.getElementById('dailyGoalName');
const dailySummaryOverlay = document.getElementById('dailySummaryOverlay');
const closeDailySummary = document.getElementById('closeDailySummary');
let dailySummaryShown = false;

closeDailySummary.addEventListener('click', function() {
    dailySummaryOverlay.classList.add('hidden');
});

function checkDailySummary(tasks) {
    const now = new Date();
    const currentHour = now.getHours();

    if (currentHour >= 21 && !dailySummaryShown) {
        const doneCount = tasks.filter(function(t) { return t.done; }).length;
        const remainingCount = tasks.length - doneCount;
        const percent = tasks.length > 0 ? Math.round((doneCount / tasks.length) * 100) : 0;

        document.getElementById('summaryDone').textContent = '✅ أنجزت ' + doneCount + ' مهام';
        document.getElementById('summaryRemaining').textContent = '⏳ تبقى ' + remainingCount + ' مهام';
        document.getElementById('summaryPercent').textContent = '🎯 نسبة الإنجاز ' + percent + '%';

        dailySummaryOverlay.classList.remove('hidden');
        dailySummaryShown = true;
    }
}

closeCelebration.addEventListener('click', function() {
    celebrationOverlay.classList.add('hidden');
});

        function createTaskElement(task) {
            const li = document.createElement('li');
            if (task.done) {
                li.classList.add('completed');
            }

            const span = document.createElement('span');
            span.textContent = task.title;
            span.classList.add('task-text');

            const buttonsDiv = document.createElement('div');
            buttonsDiv.classList.add('task-buttons');

            const analyzeButton = document.createElement('button');
            analyzeButton.type = 'button';
            analyzeButton.textContent = '🤖حلّل المهمة';
            analyzeButton.classList.add('analyze-btn');
            analyzeButton.title = 'حلّل هذه المهمة';
            const pinButton = document.createElement('button');
            pinButton.type = 'button';   
pinButton.textContent = task.pinned ? '📌' : '📍';
pinButton.classList.add('pin-btn');

pinButton.addEventListener('click', async function() {
    await fetch('/tasks/' + task.id + '/pin', {
        method: 'PUT',
        credentials: 'include'
    });
    loadTasks();
});
const goalButton = document.createElement('button');
goalButton.type = 'button';  
goalButton.textContent = task.is_daily_goal ? '⭐' : '☆';
goalButton.classList.add('goal-btn');

goalButton.addEventListener('click', async function() {
    await fetch('/tasks/' + task.id + '/set-goal', {
        method: 'PUT',
        credentials: 'include'
    });
    loadTasks();
});

            analyzeButton.addEventListener('click', async function() {
                analyzeButton.textContent = '⏳';
                try {
                    const response = await fetch('/tasks/' + task.id + '/analyze', {
                        credentials: 'include'
                    });
                    const data = await response.json();
                    analyzeButton.textContent = '🤖';

                    if (data.summary && data.steps) {
                        let stepsText = data.steps.map(function(step, index) {
                            return (index + 1) + '. ' + step;
                        }).join('\n');
                        alert('📋 الملخص:\n' + data.summary + '\n\n✅ الخطوات المقترحة:\n' + stepsText);
                    } else {
                        alert('حدث خطأ: ' + (data.error || 'غير معروف'));
                    }
                } catch (err) {
                    analyzeButton.textContent = '🤖';
                    alert('تعذر الاتصال بخدمة الذكاء الاصطناعي');
                }
            });

           const completeButton = document.createElement('button');
           completeButton.type = 'button';
        completeButton.textContent = '✅ تم';
        completeButton.classList.add('complete-btn');
            completeButton.addEventListener('click', async function() {
    await fetch('/tasks/' + task.id + '/toggle', {
        method: 'PUT',
        credentials: 'include'
    });
    await loadTasks();
    showNextTask();
});

            const deleteButton = document.createElement('button');
            deleteButton.type = 'button'; 
            deleteButton.textContent = '🗑️';
            deleteButton.classList.add('delete-btn');

            deleteButton.addEventListener('click', async function() {
                if (!confirm('متأكد تبي تحذف هذي المهمة؟')) return;
                await fetch('/tasks/' + task.id, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                loadTasks();
            });

            buttonsDiv.appendChild(goalButton);
            //buttonsDiv.appendChild(pinButton);
            buttonsDiv.appendChild(analyzeButton);
            buttonsDiv.appendChild(completeButton);
            buttonsDiv.appendChild(deleteButton);

            li.appendChild(span);
            li.appendChild(buttonsDiv);
            return li;
        }

        async function loadTasks() {
            loadingMsg.style.display = 'block';
            prioritizeResult.style.display = 'none';
            prioritizeResultWrapper.style.display = 'none';

            const response = await fetch('/tasks', {
                credentials: 'include'
            });

            if (response.status === 401) {
                window.location.href = '/login-page';
                return;
            }

            const tasks = await response.json();

            loadingMsg.style.display = 'none';

            if (tasks.length === 0) {
    taskCounter.textContent = '';
    emptyMsg.classList.remove('hidden');
    celebrationShown = false;
} else {
    const doneCount = tasks.filter(function(t) { return t.done; }).length;
    const remainingCount = tasks.length - doneCount;

if (remainingCount === 0) {
    taskCounter.textContent = 'لديك ' + tasks.length + ' مهام (' + doneCount + ' مكتملة)';
} else if (remainingCount === 1) {
    taskCounter.textContent = '🔥 الأخيرة! أنجزها وتكون أكملت جميع مهام اليوم.';
} else if (remainingCount <= 3) {
    taskCounter.textContent = '🏁 باقي القليل! تبقى لك ' + remainingCount + ' مهام فقط لإنهاء يومك.';
} else {
    taskCounter.textContent = 'لديك ' + tasks.length + ' مهام (' + doneCount + ' مكتملة)';
}    emptyMsg.classList.add('hidden');

    if (doneCount === tasks.length && !celebrationShown) {
        celebrationOverlay.classList.remove('hidden');
        celebrationShown = true;
    }
}
tasks.forEach(function(task) {
    const li = createTaskElement(task);
    taskList.appendChild(li);
});

const goalTask = tasks.find(function(t) { return t.is_daily_goal && !t.done; });
if (goalTask) {
    dailyGoalName.textContent = goalTask.title;
    dailyGoalBox.classList.remove('hidden');
} else {
    dailyGoalBox.classList.add('hidden');
}

checkDailySummary(tasks);
        }

        addButton.addEventListener('click', async function() {
            const taskText = taskInput.value.trim();

            if (taskText !== '') {
                const response = await fetch('/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ title: taskText })
                });

                if (response.status === 401) {
                    window.location.href = '/login-page';
                    return;
                }

                taskInput.value = '';
                loadTasks();
            }
        });

        taskInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                addButton.click();
            }
        });

        logoutButton.addEventListener('click', async function() {
            await fetch('/logout', {
                method: 'POST',
                credentials: 'include'
            });
            window.location.href = '/login-page';
        });

        const chatButton = document.getElementById('chatButton');
        const chatWindow = document.getElementById('chatWindow');
        const closeChat = document.getElementById('closeChat');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');

       

        let chatOpened = false;

chatButton.addEventListener('click', function() {
    chatWindow.classList.toggle('hidden');

    if (!chatOpened && !chatWindow.classList.contains('hidden')) {
        addChatMessage('👋 مرحبًا ' + username + '، أنا Priora AI\nكيف يمكنني مساعدتك؟', 'bot');
        chatOpened = true;
    }
});
closeChat.addEventListener('click', function() {
    chatWindow.classList.add('hidden');
});

        function addChatMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('chat-msg', sender);
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

       async function sendChatMessage() {
    const text = chatInput.value.trim();
    if (text === '') return;

    addChatMessage(text, 'user');
    chatInput.value = '';

    const typingMsg = document.createElement('div');
    typingMsg.classList.add('chat-msg', 'bot');
    typingMsg.textContent = '⏳ Priora يرد عليك الآن...';
    typingMsg.id = 'typingIndicator';
    chatMessages.appendChild(typingMsg);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ message: text })
    });

            const data = await response.json();
            document.getElementById('typingIndicator').remove();
            if (data.reply) {
                addChatMessage(data.reply, 'bot');
            } else {
                addChatMessage('حدث خطأ، حاول مرة أخرى', 'bot');
            }
        }

        chatSendBtn.addEventListener('click', sendChatMessage);

        chatInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendChatMessage();
            }
        });

const prioritizeBtn = document.getElementById('prioritizeBtn');
const prioritizeResult = document.getElementById('prioritizeResult');
const prioritizeResultWrapper = document.getElementById('prioritizeResultWrapper');

prioritizeBtn.addEventListener('click', async function() {
    prioritizeBtn.textContent = '⏳ جاري الترتيب...';
    prioritizeResult.style.display = 'none';
    prioritizeResultWrapper.style.display = 'none';

    try {
        const response = await fetch('/tasks/prioritize', {
            credentials: 'include'
        });
        const data = await response.json();

        prioritizeBtn.textContent = '🔄 أعد ترتيب يومي';
        if (data.message) {
            prioritizeResult.innerHTML = data.message;
            prioritizeResult.style.display = 'block';
            prioritizeResultWrapper.style.display = 'block';
            return;
        }

        if (data.start_with) {
            savedOrder = data.ordered;

            let orderedList = data.ordered.map(function(t, i) {
                return (i + 1) + '. ' + t;
            }).join('<br>');

            prioritizeResult.innerHTML =
                '<strong>🎯 ابدأ بـ: ' + data.start_with + '</strong><br>' +
                '<span style="color:#888;">' + data.reason + '</span><br><br>' +
                '<strong>خطتك لليوم:</strong><br>' + orderedList;
            prioritizeResult.style.display = 'block';
            prioritizeResultWrapper.style.display = 'block';
        } else {
            prioritizeResult.innerHTML = 'حدث خطأ: ' + (data.error || 'غير معروف');
            prioritizeResult.style.display = 'block';
            prioritizeResultWrapper.style.display = 'block';
        }
    } catch (err) {
        prioritizeBtn.textContent = '🤖 رتّب يومي';
        prioritizeResult.innerHTML = 'تعذر الاتصال بخدمة الذكاء الاصطناعي';
        prioritizeResult.style.display = 'block';
        prioritizeResultWrapper.style.display = 'block';
    }
});
function showNextTask() {
    if (!savedOrder) {
        nextTaskBox.classList.add('hidden');
        return;
    }

    const doneTitles = Array.from(document.querySelectorAll('#taskList li.completed .task-text'))
        .map(function(el) { return el.textContent; });

    const next = savedOrder.find(function(title) {
        return doneTitles.indexOf(title) === -1;
    });

    if (next) {
        nextTaskName.textContent = next;
        nextTaskBox.classList.remove('hidden');
    } else {
        nextTaskBox.classList.add('hidden');
    }
}

    const response = await fetch('/streak', {
        credentials: 'include'
    });
    const data = await response.json();
    const streak = data.streak;

    let message;
    if (streak < streakMessages.length) {
        message = streakMessages[streak];
    } else {
        message = streak + ' يومًا من الاستمرارية! أنت أسطورة 👑';
    }

    document.getElementById('streakDisplay').textContent = '🔥 ' + message;
}
