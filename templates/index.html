<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>priora</title>
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
        }

        h1 {
            color: white;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .top-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .logout-btn {
            background: none;
            border: 1px solid white;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-family: 'Tajawal', Arial, sans-serif;
        }

        .card {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
            width: 350px;
        }

        .input-group {
            display: flex;
            margin-bottom: 20px;
            gap: 10px;
        }

        #taskInput {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-family: 'Tajawal', Arial, sans-serif;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        #taskInput:focus {
            border-color: #764ba2;
        }

        button {
            padding: 12px 22px;
            font-size: 15px;
            font-family: 'Tajawal', Arial, sans-serif;
            font-weight: 500;
            background-color: #764ba2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #5e3a85;
        }

        .task-counter {
            text-align: center;
            font-size: 13px;
            color: #764ba2;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .empty-msg {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-top: 15px;
        }

        .hidden {
            display: none;
        }

        #taskList {
            list-style: none;
        }

        #taskList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f7f6fb;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 15px;
            animation: slideIn 0.3s ease;
            gap: 10px;
        }

        #taskList li.completed span {
            text-decoration: line-through;
            color: #aaa;
        }

        .task-text {
            flex: 1;
        }

        .task-buttons {
            display: flex;
            gap: 6px;
        }

        .analyze-btn {
            background-color: #764ba2;
            padding: 6px 12px;
            font-size: 14px;
        }

        .analyze-btn:hover {
            background-color: #5e3a85;
        }

        .complete-btn {
            background-color: #27ae60;
            padding: 6px 12px;
            font-size: 13px;
        }

        .complete-btn:hover {
            background-color: #1e8449;
        }

        .delete-btn {
            background-color: #e74c3c;
            padding: 6px 14px;
            font-size: 13px;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }

        #loadingMsg {
            display: none;
            text-align: center;
            color: #764ba2;
            font-size: 14px;
            margin-top: 10px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 10px;
            }

            h1 {
                font-size: 24px;
            }

            .card {
                width: 100%;
                padding: 20px;
            }

            .input-group {
                flex-direction: column;
            }

            #taskInput {
                margin-bottom: 10px;
            }

            button {
                width: 100%;
            }
        }

        .chat-button {
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 55px;
            height: 55px;
            background-color: #764ba2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        .chat-window {
            position: fixed;
            bottom: 90px;
            left: 25px;
            width: 300px;
            height: 400px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            overflow: hidden;
        }
        .chat-window.hidden {
            display: none !important;
        }

        .chat-header {
            background-color: #764ba2;
            color: white;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
        }

        .close-chat {
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-size: 13px;
        }

        .chat-msg {
            margin-bottom: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.4;
        }

        .chat-msg.user {
            background-color: #764ba2;
            color: white;
            margin-left: auto;
        }

        .chat-msg.bot {
            background-color: #f0f0f0;
            color: #333;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            gap: 6px;
            border-top: 1px solid #eee;
        }

        .chat-input-area input {
            flex: 1;
            padding: 8px;
            font-size: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .chat-input-area button {
            padding: 8px 12px;
            font-size: 13px;
        }
        .top-logo {
            width: 60px;
            height: auto;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <img src="/static/images/logo2.png" alt="Priora Logo" class="top-logo">
        <h1 id="greeting"></h1>
        <button class="logout-btn" id="logoutBtn">تسجيل الخروج</button>
    </div>

    <div class="card">
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="اكتب مهمة جديدة...">
            <button id="addBtn">➕ إضافة</button>
        </div>

        <p id="taskCounter" class="task-counter"></p>
        <ul id="taskList">
        </ul>
        <p id="emptyMsg" class="empty-msg hidden">لا توجد مهام حاليًا 📭</p>
        <div id="loadingMsg">⏳ جاري التحميل...</div>
    </div>

    <div id="chatButton" class="chat-button">💬</div>

    <div id="chatWindow" class="chat-window hidden">
        <div class="chat-header">
            <span>مساعد Priora 🤖</span>
            <span id="closeChat" class="close-chat">✕</span>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="اكتب رسالتك...">
            <button id="chatSendBtn">إرسال</button>
        </div>
    </div>

    <script>
        const username = "{{ username }}";
        const greetingEl = document.getElementById('greeting');
        const currentHour = new Date().getHours();

        let greetingText = '';
        if (currentHour >= 0 && currentHour < 12) {
            greetingText = 'صباح الخير';
        } else {
            greetingText = 'مساء الخير';
        }

        greetingEl.textContent = greetingText + '، ' + username;

        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');
        const addButton = document.getElementById('addBtn');
        const logoutButton = document.getElementById('logoutBtn');
        const loadingMsg = document.getElementById('loadingMsg');
        const taskCounter = document.getElementById('taskCounter');
        const emptyMsg = document.getElementById('emptyMsg');

        function createTaskElement(task) {
            const li = document.createElement('li');
            if (task.done) {
                li.classList.add('completed');
            }

            const span = document.createElement('span');
            span.textContent = task.title;
            span.classList.add('task-text');

            const buttonsDiv = document.createElement('div');
            buttonsDiv.classList.add('task-buttons');

            const analyzeButton = document.createElement('button');
            analyzeButton.textContent = '🤖';
            analyzeButton.classList.add('analyze-btn');

            analyzeButton.addEventListener('click', async function() {
                analyzeButton.textContent = '⏳';
                try {
                    const response = await fetch('/tasks/' + task.id + '/analyze', {
                        credentials: 'include'
                    });
                    const data = await response.json();
                    analyzeButton.textContent = '🤖';

                    if (data.summary && data.steps) {
                        let stepsText = data.steps.map(function(step, index) {
                            return (index + 1) + '. ' + step;
                        }).join('\n');
                        alert('📋 الملخص:\n' + data.summary + '\n\n✅ الخطوات المقترحة:\n' + stepsText);
                    } else {
                        alert('حدث خطأ: ' + (data.error || 'غير معروف'));
                    }
                } catch (err) {
                    analyzeButton.textContent = '🤖';
                    alert('تعذر الاتصال بخدمة الذكاء الاصطناعي');
                }
            });

            const completeButton = document.createElement('button');
            completeButton.textContent = '✅ تمت';
            completeButton.classList.add('complete-btn');

            completeButton.addEventListener('click', async function() {
                await fetch('/tasks/' + task.id + '/toggle', {
                    method: 'PUT',
                    credentials: 'include'
                });
                loadTasks();
            });

            const deleteButton = document.createElement('button');
            deleteButton.textContent = '🗑️';
            deleteButton.classList.add('delete-btn');

            deleteButton.addEventListener('click', async function() {
                if (!confirm('متأكد تبي تحذف هذي المهمة؟')) return;
                await fetch('/tasks/' + task.id, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                loadTasks();
            });

            buttonsDiv.appendChild(analyzeButton);
            buttonsDiv.appendChild(completeButton);
            buttonsDiv.appendChild(deleteButton);

            li.appendChild(span);
            li.appendChild(buttonsDiv);
            return li;
        }

        async function loadTasks() {
            loadingMsg.style.display = 'block';
            taskList.innerHTML = '';

            const response = await fetch('/tasks', {
                credentials: 'include'
            });

            if (response.status === 401) {
                window.location.href = '/login-page';
                return;
            }

            const tasks = await response.json();

            loadingMsg.style.display = 'none';

            if (tasks.length === 0) {
                taskCounter.textContent = '';
                emptyMsg.classList.remove('hidden');
            } else {
                const doneCount = tasks.filter(function(t) { return t.done; }).length;
                taskCounter.textContent = 'لديك ' + tasks.length + ' مهام (' + doneCount + ' مكتملة)';
                emptyMsg.classList.add('hidden');
            }

            tasks.forEach(function(task) {
                const li = createTaskElement(task);
                taskList.appendChild(li);
            });
        }

        addButton.addEventListener('click', async function() {
            const taskText = taskInput.value.trim();

            if (taskText !== '') {
                const response = await fetch('/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ title: taskText })
                });

                if (response.status === 401) {
                    window.location.href = '/login-page';
                    return;
                }

                taskInput.value = '';
                loadTasks();
            }
        });

        taskInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                addButton.click();
            }
        });

        logoutButton.addEventListener('click', async function() {
            await fetch('/logout', {
                method: 'POST',
                credentials: 'include'
            });
            window.location.href = '/login-page';
        });

        const chatButton = document.getElementById('chatButton');
        const chatWindow = document.getElementById('chatWindow');
        const closeChat = document.getElementById('closeChat');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');

        chatButton.addEventListener('click', function() {
            chatWindow.classList.toggle('hidden');
        });

        closeChat.addEventListener('click', function() {
            chatWindow.classList.add('hidden');
        });

        function addChatMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('chat-msg', sender);
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendChatMessage() {
            const text = chatInput.value.trim();
            if (text === '') return;

            addChatMessage(text, 'user');
            chatInput.value = '';

            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();

            if (data.reply) {
                addChatMessage(data.reply, 'bot');
            } else {
                addChatMessage('حدث خطأ، حاول مرة أخرى', 'bot');
            }
        }

        chatSendBtn.addEventListener('click', sendChatMessage);

        chatInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendChatMessage();
            }
        });

        loadTasks();
    </script>
</body>
</html>
